    <style>
/* Theme tokens: add a new client look by adding one [data-theme] block. */
:root[data-theme="cyber"] {
  color-scheme: dark;
  --bg: #0a0a0f;
  --hero-from: #12121a;
  --hero-to: #08080c;
  --panel: rgba(24, 24, 32, 0.4);
  --surface: rgba(24, 24, 32, 0.6);
  --surface-hover: rgba(39, 39, 48, 0.75);
  --bar: rgba(9, 9, 13, 0.85);
  --border: #27272f;
  --border-strong: #3f3f4a;
  --text: #f4f4f5;
  --text-muted: #a1a1aa;
  --accent: #38bdf8;
  --accent-hover: #7dd3fc;
  --accent-text: #04121c;
  --accent-soft: rgba(56, 189, 248, 0.12);
  --glow-a: #38bdf8;
  --glow-b: #a855f7;
  --radius: 16px;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

:root[data-theme="luxe"] {
  color-scheme: light;
  --bg: #faf7f2;
  --hero-from: #faf7f2;
  --hero-to: #f2ece1;
  --panel: rgba(255, 255, 255, 0.45);
  --surface: rgba(255, 255, 255, 0.72);
  --surface-hover: #ffffff;
  --bar: rgba(255, 255, 255, 0.88);
  --border: #e6dccb;
  --border-strong: #cbbda3;
  --text: #1c1917;
  --text-muted: #6b6459;
  --accent: #b48a3c;
  --accent-hover: #9c742c;
  --accent-text: #ffffff;
  --accent-soft: rgba(180, 138, 60, 0.12);
  --glow-a: #d4af37;
  --glow-b: #8c6b2f;
  --radius: 14px;
  --font: "Cormorant Garamond", "Times New Roman", Georgia, serif;
}

:root[data-theme="artisan"] {
  color-scheme: light;
  --bg: #f5f0e1;
  --hero-from: #f7f2e4;
  --hero-to: #ebe5d5;
  --panel: rgba(255, 255, 255, 0.42);
  --surface: rgba(255, 255, 255, 0.7);
  --surface-hover: #ffffff;
  --bar: rgba(255, 255, 255, 0.9);
  --border: #e3d9c2;
  --border-strong: #c9b894;
  --text: #1f1b16;
  --text-muted: #6a6152;
  --accent: #c2410c;
  --accent-hover: #9a3412;
  --accent-text: #ffffff;
  --accent-soft: rgba(194, 65, 12, 0.1);
  --glow-a: #f97316;
  --glow-b: #e11d48;
  --radius: 18px;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html,
body {
  margin: 0;
  height: 100%;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

/* ---------- Hero ---------- */
.hero {
  position: relative;
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 20px 20px 18px;
  text-align: center;
  background: linear-gradient(140deg, var(--hero-from), var(--hero-to));
  overflow: hidden;
}

.hero__glow {
  position: absolute;
  inset: 0;
  opacity: 0.12;
  pointer-events: none;
}

.hero__glow::before,
.hero__glow::after {
  content: "";
  position: absolute;
  width: 24rem;
  height: 24rem;
  border-radius: 9999px;
  filter: blur(72px);
}

.hero__glow::before {
  top: 0;
  left: 0;
  background: var(--glow-a);
  transform: translate(-50%, -50%);
}

.hero__glow::after {
  right: 0;
  bottom: 0;
  background: var(--glow-b);
  transform: translate(50%, 50%);
}

.hero__inner {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  max-width: 34rem;
  min-width: 0;
}

.hero__logo {
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--accent);
  overflow: hidden;
}

.hero__logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.hero__name {
  margin: 0;
  font-size: clamp(1.4rem, 5vw, 2.4rem);
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: -0.02em;
  overflow-wrap: anywhere;
}

.hero__tagline {
  margin: 0;
  font-size: 0.95rem;
  line-height: 1.5;
  color: var(--text-muted);
  overflow-wrap: anywhere;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-radius: 9999px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 0.82rem;
  color: var(--text-muted);
}

.badge__dot {
  width: 8px;
  height: 8px;
  border-radius: 9999px;
  background: #10b981;
}

.badge[data-tone="closed"] .badge__dot {
  background: #ef4444;
}

/* ---------- Catalogue panel ---------- */
.panel {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-height: 0;
  background: var(--panel);
  border-top: 1px solid var(--border);
}

.tabs {
  display: flex;
  gap: 4px;
  padding: 10px;
  margin: 12px auto 0;
  width: min(100%, 26rem);
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  flex: 1 0 auto;
  padding: 9px 14px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text-muted);
  font: inherit;
  font-size: 0.86rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.18s ease, color 0.18s ease;
}

.tab[aria-selected="true"] {
  background: var(--accent);
  color: var(--accent-text);
  font-weight: 700;
}

.catalogue {
  flex: 1;
  min-height: 0;
  padding: 14px 16px 18px;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.card-list {
  display: grid;
  gap: 10px;
  max-width: 46rem;
  margin: 0 auto;
}

.card {
  display: flex;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  user-select: none;
  transition: border-color 0.18s ease, background 0.18s ease, transform 0.12s ease;
}

.card:hover:not([data-sold-out]) {
  border-color: var(--border-strong);
  background: var(--surface-hover);
}

.card:has(.card__main:active) {
  transform: scale(0.985);
}

.card[data-selected="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.card[data-sold-out] {
  opacity: 0.45;
}

/* The card's own hit area — the stepper is a sibling, never nested inside it. */
.card__main {
  display: flex;
  flex: 1;
  align-items: center;
  gap: 14px;
  min-width: 0;
  padding: 14px 16px;
  border: 0;
  border-radius: inherit;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.card__main[disabled] {
  cursor: not-allowed;
}

.card__aside {
  display: flex;
  align-items: center;
  padding-right: 14px;
}

.card__body {
  flex: 1;
  min-width: 0;
}

.card__name {
  margin: 0;
  font-size: 1rem;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.card[data-selected="true"] .card__name {
  color: var(--accent);
}

.card__desc {
  margin: 3px 0 0;
  font-size: 0.85rem;
  line-height: 1.4;
  color: var(--text-muted);
  overflow-wrap: anywhere;
}

.card__price {
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
}

.card__check {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 9999px;
  border: 1px solid var(--border-strong);
  color: var(--accent-text);
  font-size: 0.7rem;
}

.card[data-selected="true"] .card__check {
  background: var(--accent);
  border-color: var(--accent);
}

/* Quantity stepper */
.stepper {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--border);
  border-radius: 9999px;
  background: var(--bg);
}

.stepper__btn {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 9999px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
}

.stepper__btn:hover {
  background: var(--accent-soft);
  color: var(--accent);
}

.stepper__qty {
  min-width: 20px;
  text-align: center;
  font-size: 0.88rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.empty {
  padding: 28px 10px;
  text-align: center;
  color: var(--text-muted);
  font-size: 0.9rem;
}

/* ---------- Checkout bar ---------- */
.checkout {
  flex: 0 0 auto;
  border-top: 1px solid var(--border);
  background: var(--bar);
  backdrop-filter: blur(12px);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
}

.checkout__inner {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 46rem;
  margin: 0 auto;
}

.basket {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  overflow: hidden;
}

.basket__toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 0.85rem;
  cursor: pointer;
}

.basket__lines {
  display: grid;
  gap: 6px;
  max-height: 26vh;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 0 12px 12px;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.basket__line {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.basket__line--fee {
  font-style: italic;
}

.checkout__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.summary {
  min-width: 0;
}

.summary__count {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.summary__total {
  font-size: 1.25rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 13px 20px;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-text);
  font: inherit;
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.18s ease, transform 0.12s ease;
}

.cta:hover:not([disabled]) {
  background: var(--accent-hover);
}

.cta:active:not([disabled]) {
  transform: scale(0.97);
}

.cta[disabled] {
  opacity: 0.5;
  cursor: not-allowed;
}

.hint {
  margin: 0;
  font-size: 0.78rem;
  color: var(--text-muted);
  min-height: 1rem;
}

.pop {
  animation: pop 0.25s ease;
}

@keyframes pop {
  0% { transform: scale(1); }
  45% { transform: scale(1.12); }
  100% { transform: scale(1); }
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

/* ---------- Hero extras: rating pill + socials ---------- */
.hero__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.rating {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 9999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-size: 0.8rem;
  text-decoration: none;
}

.rating:hover {
  border-color: var(--accent);
  color: var(--text);
}

.rating__value {
  font-variant-numeric: tabular-nums;
}

.stars {
  display: inline-flex;
  gap: 1px;
  font-size: 0.8rem;
  line-height: 1;
}

.stars__star {
  color: var(--border-strong);
}

.stars__star[data-on="true"] {
  color: var(--accent);
}

.socials {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.social {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border-radius: 9999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.18s ease, border-color 0.18s ease;
}

.social:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.social svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

.socials--labelled .social {
  padding: 8px 14px;
  border-radius: 9999px;
  font-size: 0.82rem;
}

/* ---------- Reviews page ---------- */
.hero--compact {
  padding: 18px 20px;
}

.back {
  align-self: flex-start;
  font-size: 0.82rem;
  color: var(--text-muted);
  text-decoration: none;
}

.back:hover {
  color: var(--accent);
}

.reviews {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-height: 0;
  padding: 16px;
}

.reviews__head {
  flex: 0 0 auto;
  max-width: 46rem;
  width: 100%;
  margin: 0 auto 14px;
}

.reviews__headline {
  margin: 0;
  font-size: clamp(1.2rem, 3.5vw, 1.6rem);
  letter-spacing: -0.01em;
}

.reviews__intro {
  margin: 6px 0 0;
  font-size: 0.88rem;
  color: var(--text-muted);
}

.score {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}

.score__value {
  font-size: 2rem;
  font-weight: 700;
  line-height: 1;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.score__meta {
  display: grid;
  gap: 4px;
}

.score__count {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.reviews__list {
  display: grid;
  gap: 10px;
  flex: 1;
  min-height: 0;
  align-content: start;
  max-width: 46rem;
  width: 100%;
  margin: 0 auto;
  padding-right: 2px;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.review {
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}

.review__head {
  display: flex;
  align-items: center;
  gap: 12px;
}

.review__avatar {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: 0 0 auto;
  border-radius: 9999px;
  border: 1px solid var(--border);
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 0.8rem;
  font-weight: 700;
}

.review__who {
  flex: 1;
  min-width: 0;
}

.review__name {
  margin: 0;
  font-size: 0.95rem;
  font-weight: 600;
}

.review__meta,
.review__source {
  margin: 2px 0 0;
  font-size: 0.78rem;
  color: var(--text-muted);
}

.review__text {
  margin: 10px 0 0;
  font-size: 0.9rem;
  line-height: 1.55;
}

.reviews__foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex: 0 0 auto;
  max-width: 46rem;
  width: 100%;
  margin: 14px auto 0;
  padding-bottom: env(safe-area-inset-bottom);
}

.cta--link {
  text-decoration: none;
}

/* ---------- Desktop split layout ---------- */
@media (min-width: 768px) {
  .app {
    flex-direction: row;
  }

  .hero {
    flex: 0 0 40%;
    padding: 40px;
    gap: 16px;
  }

  .reviews {
    padding: 24px;
  }

  .hero__logo {
    width: 88px;
    height: 88px;
    border-radius: 20px;
    font-size: 1.6rem;
  }

  .panel {
    flex: 1;
    border-top: 0;
    border-left: 1px solid var(--border);
  }

  .tabs {
    margin-top: 20px;
  }

  .catalogue {
    padding: 20px 24px 24px;
  }

  .checkout {
    padding: 16px 24px;
  }
}

    </style>
</head>
<body>
    <main class="app">
        <!-- Branding -->
        <header class="hero">
            <div class="hero__glow" aria-hidden="true"></div>
            <div class="hero__inner">
                <div class="hero__logo" id="logo"></div>
                <h1 class="hero__name" id="business-name"></h1>
                <p class="hero__tagline" id="tagline"></p>
                <div class="badge" id="status-badge">
                    <span class="badge__dot" aria-hidden="true"></span>
                    <span id="status-text"></span>
                </div>
                <div class="hero__meta">
                    <a class="rating" id="rating-link" href="reviews.html" hidden></a>
                    <div class="socials" id="socials" aria-label="Social links" hidden></div>
                </div>
            </div>
        </header>

        <!-- Catalogue -->

    /* ---- config.js ---- */
/*
 * The only file you edit for a new client.
 *
 * Fastest path: pick the preset closest to the client's niche below, then open
 * presets.js and edit that entry (or paste it here and edit it in place).
 *
 * Available: "salon" | "cafe" | "detailing" | "aircon" | "plumbing"
 * Preview any of them without editing: index.html?preset=detailing&theme=cyber
 */
const CLIENT = "salon";

/* Own client? Replace the line below with your own object — same shape as any preset. */
const requestedPreset = new URLSearchParams(location.search).get("preset");
const CONFIG = PRESETS[requestedPreset] || PRESETS[CLIENT];

    /* ---- shared.js ---- */
/*
 * Shared by the storefront and the reviews page: branding, socials, ratings,
 * formatting. No business data lives in this file.
 */
const params = new URLSearchParams(location.search);

/* Keep ?theme= / ?preset= when moving between pages so previews stay consistent. */
function withParams(href) {
  const query = params.toString();
  return query ? `${href}?${query}` : href;
}

function money(amount) {
  const { symbol, locale, decimals } = CONFIG.currency;
  return `${symbol}${amount.toLocaleString(locale, {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals,
  })}`;
}

function initials(name) {
  return name
    .split(/\s+/)
    .filter(Boolean)
    .slice(0, 2)
    .map((word) => word[0].toUpperCase())
    .join("");
}

function resolveTheme() {
  const requested = params.get("theme");
  const themes = ["cyber", "luxe", "artisan"];
  return themes.includes(requested) ? requested : CONFIG.theme;
}

function socialIcon(label) {
  const key = label.toLowerCase().replace(/[^a-z]/g, "");
  const path = SOCIAL_PATHS[key] || SOCIAL_PATHS.website;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("focusable", "false");
  const shape = document.createElementNS("http://www.w3.org/2000/svg", "path");
  shape.setAttribute("d", path);
  svg.append(shape);
  return svg;
}

function renderSocials(container, options = {}) {
  if (!container) return;
  const socials = CONFIG.socials || [];
  container.hidden = socials.length === 0;
  container.replaceChildren(
    ...socials.map((social) => {
      const link = document.createElement("a");
      link.className = "social";
      link.href = social.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.setAttribute("aria-label", `${CONFIG.business.name} on ${social.label}`);
      link.append(socialIcon(social.label));
      if (options.showLabels) {
        const text = document.createElement("span");
        text.className = "social__label";
        text.textContent = social.label;
        link.append(text);
      }
      return link;
    })
  );
}

/* ---------- reviews ---------- */

function stars(rating) {
  const wrap = document.createElement("span");
  wrap.className = "stars";
  wrap.setAttribute("role", "img");
  wrap.setAttribute("aria-label", `${rating} out of 5`);
  for (let i = 1; i <= 5; i += 1) {
    const star = document.createElement("span");
    star.className = "stars__star";
    star.dataset.on = String(i <= Math.round(rating));
    star.textContent = "★";
    wrap.append(star);
  }
  return wrap;
}

/* Rating pill in the hero, linking through to the reviews page. */
function renderRatingLink(container) {
  const reviews = CONFIG.reviews;
  if (!container) return;
  if (!reviews || !reviews.rating) {
    container.hidden = true;
    return;
  }
  container.hidden = false;
  container.href = withParams("reviews.html");
  container.replaceChildren(
    stars(reviews.rating),
    Object.assign(document.createElement("span"), {
      className: "rating__value",
      textContent: reviews.count
        ? `${reviews.rating} · ${reviews.count} reviews`
        : String(reviews.rating),
    })
  );
}

/* ---------- branding ---------- */

function applyBranding() {
  const { business } = CONFIG;
  document.documentElement.dataset.theme = resolveTheme();
  document.title = business.pageTitle || business.name;

  const set = (id, text) => {
    const node = document.getElementById(id);
    if (node) node.textContent = text || "";
  };
  set("business-name", business.name);
  set("tagline", business.tagline);
  set("status-text", business.status);

  const badge = document.getElementById("status-badge");
  if (badge) {
    badge.dataset.tone = business.statusTone || "open";
    badge.hidden = !business.status;
  }

  const logo = document.getElementById("logo");
  if (logo) {
    if (business.logo) {
      const img = document.createElement("img");
      img.src = business.logo;
      img.alt = `${business.name} logo`;
      logo.replaceChildren(img);
    } else {
      logo.textContent = initials(business.name);
    }
  }

  document.querySelectorAll("[data-meta-description]").forEach((tag) => {
    tag.setAttribute("content", business.description || business.tagline);
  });
  document.querySelectorAll("[data-meta-title]").forEach((tag) => {
    tag.setAttribute("content", business.pageTitle || business.name);
  });
  if (business.shareImage) {
    document.querySelectorAll("[data-meta-image]").forEach((tag) => {
      tag.setAttribute("content", business.shareImage);
    });
  }

  document.querySelectorAll("[data-keep-params]").forEach((link) => {
    link.href = withParams(link.getAttribute("href"));
  });
}

function whatsappLink(message) {
  const phone = String(CONFIG.whatsapp.phone).replace(/\D/g, "");
  if (!phone) return "";
  return `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
}

    /* ---- app.js ---- */
/*
 * Rendering + basket state. No business data lives in this file.
 */
/* Scoped per business so previewing another preset never inherits its basket. */
const STORAGE_KEY = `vae-basket-v1:${CONFIG.business.name}`;
const basket = new Map(); // itemId -> quantity

const el = {
  socials: document.getElementById("socials"),
  rating: document.getElementById("rating-link"),
  tabs: document.getElementById("tabs"),
  catalogue: document.getElementById("catalogue"),
  basket: document.getElementById("basket"),
  basketToggle: document.getElementById("basket-toggle"),
  basketLabel: document.getElementById("basket-label"),
  basketLines: document.getElementById("basket-lines"),
  count: document.getElementById("count"),
  total: document.getElementById("total"),
  cta: document.getElementById("cta"),
  hint: document.getElementById("hint"),
};

const labels = CONFIG.labels || {};

const itemIndex = new Map();
CONFIG.categories.forEach((category) =>
  category.items.forEach((item) => itemIndex.set(item.id, { ...item, category: category.label }))
);

/* ---------- helpers ---------- */

function feeTotal() {
  return (CONFIG.fees || []).reduce((sum, fee) => sum + fee.amount, 0);
}

function itemsTotal() {
  let sum = 0;
  basket.forEach((qty, id) => {
    sum += itemIndex.get(id).price * qty;
  });
  return sum;
}

function itemCount() {
  let sum = 0;
  basket.forEach((qty) => {
    sum += qty;
  });
  return sum;
}

/* ---------- rendering ---------- */

function renderTabs() {
  el.tabs.replaceChildren(
    ...CONFIG.categories.map((category, index) => {
      const tab = document.createElement("button");
      tab.type = "button";
      tab.className = "tab";
      tab.id = `tab-${category.id}`;
      tab.setAttribute("role", "tab");
      tab.textContent = category.label;
      tab.setAttribute("aria-selected", String(index === 0));
      tab.setAttribute("aria-controls", `panel-${category.id}`);
      tab.tabIndex = index === 0 ? 0 : -1;
      tab.addEventListener("click", () => selectCategory(category.id));
      return tab;
    })
  );
  el.tabs.addEventListener("keydown", onTabKeydown);
}

function card(item) {
  const selected = basket.has(item.id);
  const soldOut = item.available === false;

  const wrapper = document.createElement("div");
  wrapper.className = "card";
  wrapper.dataset.itemId = item.id;
  wrapper.dataset.selected = String(selected);
  if (soldOut) {
    wrapper.dataset.soldOut = "true";
  }

  const button = document.createElement("button");
  button.type = "button";
  button.className = "card__main";
  button.setAttribute("aria-pressed", String(selected));
  button.disabled = soldOut;

  const body = document.createElement("div");
  body.className = "card__body";
  const name = document.createElement("h3");
  name.className = "card__name";
  name.textContent = soldOut ? `${item.name} — sold out` : item.name;
  body.append(name);
  if (item.desc) {
    const desc = document.createElement("p");
    desc.className = "card__desc";
    desc.textContent = item.desc;
    body.append(desc);
  }

  const price = document.createElement("span");
  price.className = item.price ? "card__price" : "card__price card__price--quote";
  price.textContent = item.price ? money(item.price) : item.note || "On quote";

  button.append(body, price);
  button.addEventListener("click", () => toggleItem(item.id));

  const aside = document.createElement("div");
  aside.className = "card__aside";
  aside.append(selected ? stepper(item) : check());

  wrapper.append(button, aside);
  return wrapper;
}

function check() {
  const mark = document.createElement("div");
  mark.className = "card__check";
  mark.setAttribute("aria-hidden", "true");
  mark.textContent = "+";
  return mark;
}

function stepper(item) {
  const wrap = document.createElement("div");
  wrap.className = "stepper";

  const minus = document.createElement("button");
  minus.type = "button";
  minus.className = "stepper__btn";
  minus.textContent = "−";
  minus.setAttribute("aria-label", `Remove one ${item.name}`);
  minus.dataset.control = "minus";
  minus.addEventListener("click", () => changeQty(item.id, -1));

  const qty = document.createElement("span");
  qty.className = "stepper__qty";
  qty.textContent = String(basket.get(item.id));

  const plus = document.createElement("button");
  plus.type = "button";
  plus.className = "stepper__btn";
  plus.textContent = "+";
  plus.setAttribute("aria-label", `Add one ${item.name}`);
  plus.dataset.control = "plus";
  plus.addEventListener("click", () => changeQty(item.id, 1));

  wrap.append(minus, qty, plus);
  return wrap;
}

function renderCatalogue(activeId) {
  el.catalogue.replaceChildren(
    ...CONFIG.categories.map((category) => {
      const panel = document.createElement("div");
      panel.className = "card-list";
      panel.id = `panel-${category.id}`;
      panel.setAttribute("role", "tabpanel");
      panel.setAttribute("aria-labelledby", `tab-${category.id}`);
      panel.hidden = category.id !== activeId;
      if (!category.items.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "Nothing here yet — check the other categories.";
        panel.append(empty);
      } else {
        panel.append(...category.items.map(card));
      }
      return panel;
    })
  );
}

function renderBasket() {
  const count = itemCount();
  const items = itemsTotal();
  const fees = count ? feeTotal() : 0;

  el.count.textContent = count === 1 ? "1 item selected" : `${count} items selected`;
  el.total.textContent = money(items + fees);
  el.total.classList.remove("pop");
  if (count) {
    void el.total.offsetWidth;
    el.total.classList.add("pop");
  }

  el.basket.hidden = count === 0;
  el.basketLabel.textContent = count === 1 ? "1 item in basket" : `${count} items in basket`;

  const lines = [];
  basket.forEach((qty, id) => {
    const item = itemIndex.get(id);
    lines.push({
      label: `${qty}× ${item.name}`,
      value: item.price ? money(item.price * qty) : item.note || "On quote",
    });
  });
  (CONFIG.fees || []).forEach((fee) => {
    if (count) lines.push({ label: fee.label, value: money(fee.amount), fee: true });
  });

  el.basketLines.replaceChildren(
    ...lines.map((line) => {
      const row = document.createElement("div");
      row.className = line.fee ? "basket__line basket__line--fee" : "basket__line";
      const label = document.createElement("span");
      label.textContent = line.label;
      const value = document.createElement("span");
      value.textContent = line.value;
      row.append(label, value);
      return row;
    })
  );

  const belowMinimum = CONFIG.minimumOrder && items > 0 && items < CONFIG.minimumOrder;
  el.cta.disabled = count === 0 || belowMinimum;
  if (!count) {
    el.hint.textContent = labels.emptyHint || "Tap an item to start your order.";
  } else if (belowMinimum) {
    const scope = feeTotal() ? " before fees" : "";
    el.hint.textContent = `Minimum order is ${money(CONFIG.minimumOrder)}${scope} — add ${money(
      CONFIG.minimumOrder - items
    )} more.`;
  } else {
    el.hint.textContent = "";
  }
}

/* ---------- state ---------- */

function selectCategory(categoryId) {
  Array.from(el.tabs.children).forEach((tab) => {
    const active = tab.id === `tab-${categoryId}`;
    tab.setAttribute("aria-selected", String(active));
    tab.tabIndex = active ? 0 : -1;
  });
  Array.from(el.catalogue.children).forEach((panel) => {
    panel.hidden = panel.id !== `panel-${categoryId}`;
  });
  el.catalogue.scrollTop = 0;
}

function onTabKeydown(event) {
  const tabs = Array.from(el.tabs.children);
  const current = tabs.findIndex((tab) => tab.getAttribute("aria-selected") === "true");
  const offset = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0;
  if (!offset) return;
  event.preventDefault();
  const next = tabs[(current + offset + tabs.length) % tabs.length];
  selectCategory(next.id.replace("tab-", ""));
  next.focus();
}

function activeCategoryId() {
  const active = Array.from(el.tabs.children).find(
    (tab) => tab.getAttribute("aria-selected") === "true"
  );
  return active ? active.id.replace("tab-", "") : CONFIG.categories[0].id;
}

/* Re-rendering a category drops focus, so put it back where the user left it. */
function focusTarget() {
  const focused = document.activeElement;
  const card = focused && focused.closest ? focused.closest(".card") : null;
  if (!card) return null;
  return { itemId: card.dataset.itemId, control: focused.dataset.control || "main" };
}

function restoreFocus(target) {
  if (!target) return;
  const card = el.catalogue.querySelector(`[data-item-id="${target.itemId}"]`);
  if (!card) return;
  const next =
    card.querySelector(`[data-control="${target.control}"]`) || card.querySelector(".card__main");
  if (next) next.focus();
}

function refreshCards() {
  const target = focusTarget();
  renderCatalogue(activeCategoryId());
  renderBasket();
  restoreFocus(target);
  save();
}

function toggleItem(itemId) {
  if (basket.has(itemId)) {
    basket.delete(itemId);
  } else {
    basket.set(itemId, 1);
  }
  refreshCards();
}

function changeQty(itemId, delta) {
  const next = (basket.get(itemId) || 0) + delta;
  if (next <= 0) {
    basket.delete(itemId);
  } else {
    basket.set(itemId, Math.min(next, 99));
  }
  refreshCards();
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(basket.entries())));
  } catch (error) {
    /* private mode — basket simply will not persist */
  }
}

function restore() {
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    stored.forEach(([id, qty]) => {
      const item = itemIndex.get(id);
      if (item && item.available !== false && Number.isFinite(qty) && qty > 0) {
        basket.set(id, Math.min(qty, 99));
      }
    });
  } catch (error) {
    /* corrupt storage — start with an empty basket */
  }
}

/* ---------- checkout ---------- */

function orderReference() {
  return Math.random().toString(36).slice(2, 6).toUpperCase();
}

function buildMessage() {
  const lines = [CONFIG.whatsapp.greeting, ""];
  basket.forEach((qty, id) => {
    const item = itemIndex.get(id);
    const value = item.price ? money(item.price * qty) : item.note || "On quote";
    lines.push(`• ${qty}× ${item.name} — ${value}`);
  });
  (CONFIG.fees || []).forEach((fee) => lines.push(`• ${fee.label} — ${money(fee.amount)}`));
  lines.push("", `Total: ${money(itemsTotal() + feeTotal())}`, `Ref: #${orderReference()}`);
  if (CONFIG.whatsapp.closing) lines.push("", CONFIG.whatsapp.closing);
  return lines.join("\n");
}

function checkout() {
  if (!basket.size) return;
  const url = whatsappLink(buildMessage());
  if (!url) {
    el.hint.textContent = "No WhatsApp number configured yet.";
    return;
  }
  window.open(url, "_blank", "noopener");
}

/* ---------- boot ---------- */

applyBranding();
el.cta.firstChild.textContent = labels.cta || "Order on WhatsApp";
renderSocials(el.socials);
renderRatingLink(el.rating);
renderTabs();
restore();
renderCatalogue(CONFIG.categories[0].id);
renderBasket();

el.cta.addEventListener("click", checkout);
el.basketToggle.addEventListener("click", () => {
  const expanded = el.basketToggle.getAttribute("aria-expanded") === "true";
  el.basketToggle.setAttribute("aria-expanded", String(!expanded));
  el.basketLines.hidden = expanded;
});

    <script>
    (() => {
        const params = new URLSearchParams(location.search);
        const go = (key, value) => {
            params.set(key, value);
            location.search = params.toString();
        };
        const fill = (id, values, current, key) => {
            const select = document.getElementById(id);
            values.forEach((value) => {
                const option = document.createElement("option");
                option.value = value;
                option.textContent = value[0].toUpperCase() + value.slice(1);
                option.selected = value === current;
                select.append(option);
            });
            select.addEventListener("change", (event) => go(key, event.target.value));
        };
        fill("pick-preset", Object.keys(PRESETS), params.get("preset") || CLIENT, "preset");
        fill("pick-theme", ["cyber", "luxe", "artisan"], document.documentElement.dataset.theme, "theme");
    })();
    </script>
